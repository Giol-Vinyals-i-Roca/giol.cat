/* Layout: single long page. Clean white (or black) ground, one full-bleed yellow band for the flagship research, date-led timeline. */
:root {
  --bg: #ffffff;
  --fg: #121210;
  --muted: #66624f;
  --line: #e7e4d8;
  --surface: #f7f6f0;
  --yellow: #ffd21f;
  --on-yellow: #121210;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0d; --fg: #f4f3ec; --muted: #a9a591; --line: #2b2a25; --surface: #191915;
    --yellow: #ffd21f; --on-yellow: #121210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0d; --fg: #f4f3ec; --muted: #a9a591; --line: #2b2a25; --surface: #191915;
  --yellow: #ffd21f; --on-yellow: #121210; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1rem; line-height: 1.6;
  font-stretch: 100%;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.wrap { max-width: 68rem; margin-inline: auto; padding-inline: 20px; }

/* Nav */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.5rem; }
.mark {
  font-family: var(--display); font-stretch: 125%; font-weight: 800; letter-spacing: -0.01em;
  text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;
}
.mark img { width: 30px; height: 30px; display: block; }
.links { display: flex; gap: 1.25rem; font-size: 0.875rem; }
.links a { text-decoration: none; color: var(--muted); }
.links a:hover { color: var(--fg); }
@media (max-width: 760px) { .links { display: none; } }
.lang { display: inline-flex; border: 1.5px solid var(--fg); }
.lang button {
  font: 500 0.75rem/1 var(--mono); letter-spacing: 0.06em;
  background: transparent; color: var(--fg); border: 0; padding: 0.45rem 0.65rem; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Hero */
.hero { padding-block: clamp(2.5rem, 6vw, 5rem) 2.5rem; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: end; }
@media (max-width: 760px) { .hero .wrap { grid-template-columns: 1fr; } }
.eyebrow { font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
h1 {
  font-family: var(--display); font-stretch: 125%; font-weight: 850;
  font-size: clamp(2rem, 7.4vw, 5rem); line-height: 0.98; letter-spacing: -0.02em;
  margin: 0 0 1.5rem; text-wrap: balance;
}
h1 .hl { background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%); padding-inline: 0.04em; }
.tagline { font-size: clamp(1.125rem, 2vw, 1.375rem); line-height: 1.45; max-width: 34ch; margin: 0 0 1.25rem; font-weight: 500; }
.about { color: var(--muted); max-width: 62ch; margin: 0; }
.coords { font: 400 0.75rem/1.5 var(--mono); color: var(--muted); margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
.coords b { color: var(--fg); font-weight: 500; }

.photo { position: relative; max-width: 100%; width: 100%; margin: 0; }
.photo img { display: block; width: 100%; height: auto; background: var(--surface); }
.photo::after { content: ""; position: absolute; right: -10px; bottom: -10px; width: 40%; height: 40%; background: var(--yellow); z-index: -1; }
.photo-wrap { position: relative; z-index: 0; max-width: 22rem; justify-self: end; width: 100%; }
@media (max-width: 760px) { .photo-wrap { justify-self: start; max-width: 16rem; } }

/* Facts */
.facts .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--fg); }
@media (max-width: 760px) { .facts .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact { padding-block: 1rem; padding-right: 1rem; border-bottom: 1px solid var(--line); }
.fact strong { display: block; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 1.375rem; line-height: 1.2; }
.fact span { font-size: 0.8125rem; color: var(--muted); }

/* Sections */
section.block { padding-block: clamp(3rem, 7vw, 5rem) 0; }
.sec-head { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem; }
h2 {
  font-family: var(--display); font-stretch: 125%; font-weight: 800;
  font-size: clamp(1.5rem, 3.4vw, 2.25rem); line-height: 1.1; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
}
.sec-head .rule { flex: 1; height: 2px; background: var(--fg); align-self: center; }

/* Featured research band */
.band { background: var(--yellow); color: var(--on-yellow); margin-top: clamp(3rem, 7vw, 5rem); padding-block: clamp(2.5rem, 6vw, 4rem); }
.band .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3rem); align-items: center; }
@media (max-width: 760px) { .band .wrap { grid-template-columns: 1fr; } }
.band .eyebrow { color: var(--on-yellow); opacity: 0.75; }
.band h2 { color: var(--on-yellow); margin-bottom: 0.5rem; }
.band .role { font: 500 0.8125rem/1.5 var(--mono); margin: 0 0 1.25rem; }
.band p.desc { margin: 0 0 1.25rem; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0; margin: 0; list-style: none; }
.tags li { font: 500 0.75rem/1 var(--mono); border: 1.5px solid var(--on-yellow); padding: 0.45rem 0.6rem; }
.naut-photo { margin: 0; width: 100%; }
.naut-photo img { display: block; width: 100%; height: auto; border: 3px solid var(--on-yellow); }
.naut-photo figcaption { font: 500 0.75rem/1.4 var(--mono); color: var(--on-yellow); margin-top: 0.5rem; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl > li { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 1.5rem; padding-block: 1.5rem; border-top: 1px solid var(--line); }
.tl > li.has-img { grid-template-columns: 10rem minmax(0, 1fr) 15rem; }
.tl figure { margin: 0; }
.tl figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface); }
@media (max-width: 900px) { .tl > li.has-img { grid-template-columns: 10rem minmax(0, 1fr); } .tl > li.has-img figure { grid-column: 2; max-width: 20rem; } }
.tl > li:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 640px) { .tl > li, .tl > li.has-img { grid-template-columns: 1fr; gap: 0.35rem; } .tl > li.has-img figure { grid-column: auto; margin-top: 0.75rem; } }
.when { font: 500 0.8125rem/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.org { font-weight: 700; font-size: 1.0625rem; margin: 0; }
.role-line { margin: 0 0 0.6rem; color: var(--muted); }
.tl ul { margin: 0; padding-left: 1.1rem; max-width: 66ch; }
.tl ul li { margin-bottom: 0.25rem; }
.tl ul li::marker { color: var(--muted); }
.note { margin: 0.6rem 0 0; font-size: 0.875rem; display: flex; gap: 0.5rem; align-items: baseline; }
.note::before { content: ""; width: 0.55rem; height: 0.55rem; background: var(--yellow); flex: none; transform: translateY(-0.05rem); }

/* Publications */
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.pubs li { display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: 1rem; padding-block: 1.1rem; border-top: 1px solid var(--line); }
.pubs li:first-child { border-top: 0; padding-top: 0; }
.pubs .yr { font: 500 0.875rem/1.6 var(--mono); }
.pubs .t { font-weight: 600; margin: 0; }
.pubs .v { color: var(--muted); font-size: 0.875rem; margin: 0.15rem 0 0; }
.pubs a { text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* Two-col areas */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 3rem; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; padding-block: 0.8rem; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .when { font-size: 0.75rem; }
.list .what { margin: 0; font-weight: 600; }
.list .sub { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.875rem; }
h3 { font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }

/* About me */
.about-me { display: grid; gap: 1rem; max-width: 66ch; margin-bottom: 2.5rem; }
.about-me p { margin: 0; }
.about-me p:first-child { font-size: clamp(1.125rem, 2vw, 1.3125rem); font-weight: 500; line-height: 1.5; }

.about-photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 2.5rem; }

.about-photos figure { margin: 0; }
.about-photos img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); }
.about-photos figcaption { font: 400 0.75rem/1.4 var(--mono); color: var(--muted); margin-top: 0.4rem; }

/* Beyond */
.beyond { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 860px) { .beyond { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .beyond { grid-template-columns: 1fr; } }
.beyond div { display: flex; flex-direction: column; }
.beyond img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); margin-bottom: 0.75rem; border-bottom: 2px solid var(--fg); }

/* Contact */
.contact { margin-top: clamp(3rem, 7vw, 5rem); background: var(--fg); color: var(--bg); padding-block: clamp(2.5rem, 6vw, 4rem); }

.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
.mail span {
  font-family: var(--display); font-stretch: 125%; font-weight: 800;
  font-size: clamp(1.5rem, 5vw, 3rem); letter-spacing: -0.01em; overflow-wrap: anywhere; user-select: all;
}
.copy {
  font: 500 0.75rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--yellow); color: var(--on-yellow); border: 0; padding: 0.7rem 0.9rem; cursor: pointer;

.social { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1.75rem; font-family: var(--mono); font-size: 0.875rem; }
.social a { text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 4px; }
footer { padding-block: 1.25rem; font: 400 0.75rem/1.5 var(--mono); color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }

/* ---------- rendering ---------- */
let lang = "en";
try {
  const saved = localStorage.getItem("giol-lang");
  if (saved === "ca" || saved === "en") lang = saved;
  else if ((navigator.language || "").toLowerCase().startsWith("ca")) lang = "ca";
} catch (e) {}

const t = (x) => (x == null ? "" : typeof x === "string" ? x : x[lang]);
const $ = (id) => document.getElementById(id);

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-k]").forEach((el) => {
    const v = t(SITE.ui[el.dataset.k]);
    if (el.dataset.k === "photo") el.innerHTML = v.replace("\n", "<br>");
    else el.textContent = v;
  });
  document.querySelectorAll("[data-alt]").forEach((el) => (el.alt = t(SITE.ui[el.dataset.alt])));
  $("links").innerHTML = SITE.nav.map((n) => `<a href="#${n.id}">${t(n)}</a>`).join("");
  $("facts").innerHTML = SITE.facts.map((f) => `<div class="fact"><strong>${f.k}</strong><span>${t(f)}</span></div>`).join("");
  $("naut-tags").innerHTML = SITE.nautTags.map((x) => `<li>${t(x)}</li>`).join("");
  $("exp").innerHTML = SITE.experience.map((e) => `
    <li${e.img ? ' class="has-img"' : ""}>
      <div class="when">${t(e.when)}</div>
      <div>
        <p class="org">${t(e.org)}</p>
        <p class="role-line">${t(e.role)}</p>
        <ul>${e.points.map((p) => `<li>${t(p)}</li>`).join("")}</ul>
        ${e.note ? `<p class="note">${t(e.note)}</p>` : ""}
      </div>
      ${e.img ? `<figure><img src="${e.img.src}" alt="${t(e.img.alt)}" loading="lazy"></figure>` : ""}
    </li>`).join("");
  $("pubs").innerHTML = SITE.publications.map((p) => `
    <li>
      <span class="yr">${p.yr}</span>
      <div>
        <p class="t">${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">${p.t}</a>` : p.t}</p>
        <p class="v">${t(p.v)}</p>
      </div>
    </li>`).join("");
  const row = (r) => `<li><span class="when">${t(r.when)}</span><div><p class="what">${t(r.what)}</p>${r.sub ? `<p class="sub">${t(r.sub)}</p>` : ""}</div></li>`;
  $("edu").innerHTML = SITE.education.map(row).join("");
  $("awards").innerHTML = SITE.awards.map(row).join("");
  $("vol").innerHTML = SITE.volunteering.map(row).join("");
  $("about-me").innerHTML = SITE.aboutMe.map((p) => `<p>${t(p)}</p>`).join("");
  $("beyond-list").innerHTML = SITE.beyond.map((b) => `<div>${b.img ? `<img src="${b.img}" alt="" loading="lazy">` : ""}<strong>${t(b.k)}</strong><span>${t(b)}</span></div>`).join("");
  $("btn-ca").setAttribute("aria-pressed", String(lang === "ca"));
  $("btn-en").setAttribute("aria-pressed", String(lang === "en"));
}

document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("giol-lang", lang); } catch (e) {}
    render();
  })
);

$("copy").addEventListener("click", () => {
  const btn = $("copy");
  const done = () => { btn.textContent = t(SITE.ui.copied); setTimeout(() => (btn.textContent = t(SITE.ui.copy)), 1600); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("email"));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  try {
    navigator.clipboard.writeText($("email").textContent).then(done, fallback);
  } catch (e) { fallback(); }
});

render();
</script>

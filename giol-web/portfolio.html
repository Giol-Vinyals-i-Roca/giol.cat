<html lang="en">
<head>

<style>
/* Layout: single long page. Clean white (or black) ground, one full-bleed yellow band for the flagship research, date-led timeline. */
:root {
  --bg: #ffffff;
  --fg: #121210;
  --muted: #66624f;
  --line: #e7e4d8;
  --surface: #f7f6f0;
  --yellow: #ffd21f;
  --on-yellow: #121210;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0d; --fg: #f4f3ec; --muted: #a9a591; --line: #2b2a25; --surface: #191915;
    --yellow: #ffd21f; --on-yellow: #121210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0d; --fg: #f4f3ec; --muted: #a9a591; --line: #2b2a25; --surface: #191915;
  --yellow: #ffd21f; --on-yellow: #121210; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1rem; line-height: 1.6;
  font-stretch: 100%;
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.wrap { max-width: 68rem; margin-inline: auto; padding-inline: 20px; }

/* Nav */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.5rem; }
.mark {
  font-family: var(--display); font-stretch: 125%; font-weight: 800; letter-spacing: -0.01em;
  text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;
}
.mark img { width: 30px; height: 30px; display: block; }
.links { display: flex; gap: 1.25rem; font-size: 0.875rem; }
.links a { text-decoration: none; color: var(--muted); }
.links a:hover { color: var(--fg); }
@media (max-width: 760px) { .links { display: none; } }
.lang { display: inline-flex; border: 1.5px solid var(--fg); }
.lang button {
  font: 500 0.75rem/1 var(--mono); letter-spacing: 0.06em;
  background: transparent; color: var(--fg); border: 0; padding: 0.45rem 0.65rem; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Hero */
.hero { padding-block: clamp(2.5rem, 6vw, 5rem) 2.5rem; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: end; }
@media (max-width: 760px) { .hero .wrap { grid-template-columns: 1fr; } }
.eyebrow { font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
h1 {
  font-family: var(--display); font-stretch: 125%; font-weight: 850;
  font-size: clamp(2rem, 7.4vw, 5rem); line-height: 0.98; letter-spacing: -0.02em;
  margin: 0 0 1.5rem; text-wrap: balance;
}
h1 .hl { background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%); padding-inline: 0.04em; }
.tagline { font-size: clamp(1.125rem, 2vw, 1.375rem); line-height: 1.45; max-width: 34ch; margin: 0 0 1.25rem; font-weight: 500; }
.about { color: var(--muted); max-width: 62ch; margin: 0; }
.coords { font: 400 0.75rem/1.5 var(--mono); color: var(--muted); margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }
.coords b { color: var(--fg); font-weight: 500; }

.photo { position: relative; max-width: 100%; width: 100%; margin: 0; }
.photo img { display: block; width: 100%; height: auto; background: var(--surface); }
.photo::after { content: ""; position: absolute; right: -10px; bottom: -10px; width: 40%; height: 40%; background: var(--yellow); z-index: -1; }
.photo-wrap { position: relative; z-index: 0; max-width: 22rem; justify-self: end; width: 100%; }
@media (max-width: 760px) { .photo-wrap { justify-self: start; max-width: 16rem; } }

/* Facts */
.facts .wrap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--fg); }
@media (max-width: 760px) { .facts .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fact { padding-block: 1rem; padding-right: 1rem; border-bottom: 1px solid var(--line); }
.fact strong { display: block; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 1.375rem; line-height: 1.2; }
.fact span { font-size: 0.8125rem; color: var(--muted); }

/* Sections */
section.block { padding-block: clamp(3rem, 7vw, 5rem) 0; }
.sec-head { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2rem; }
h2 {
  font-family: var(--display); font-stretch: 125%; font-weight: 800;
  font-size: clamp(1.5rem, 3.4vw, 2.25rem); line-height: 1.1; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
}
.sec-head .rule { flex: 1; height: 2px; background: var(--fg); align-self: center; }

/* Featured research band */
.band { background: var(--yellow); color: var(--on-yellow); margin-top: clamp(3rem, 7vw, 5rem); padding-block: clamp(2.5rem, 6vw, 4rem); }
.band .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3rem); align-items: center; }
@media (max-width: 760px) { .band .wrap { grid-template-columns: 1fr; } }
.band .eyebrow { color: var(--on-yellow); opacity: 0.75; }
.band h2 { color: var(--on-yellow); margin-bottom: 0.5rem; }
.band .role { font: 500 0.8125rem/1.5 var(--mono); margin: 0 0 1.25rem; }
.band p.desc { margin: 0 0 1.25rem; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0; margin: 0; list-style: none; }
.tags li { font: 500 0.75rem/1 var(--mono); border: 1.5px solid var(--on-yellow); padding: 0.45rem 0.6rem; }
.naut-photo { margin: 0; width: 100%; }
.naut-photo img { display: block; width: 100%; height: auto; border: 3px solid var(--on-yellow); }
.naut-photo figcaption { font: 500 0.75rem/1.4 var(--mono); color: var(--on-yellow); margin-top: 0.5rem; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl > li { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 1.5rem; padding-block: 1.5rem; border-top: 1px solid var(--line); }
.tl > li.has-img { grid-template-columns: 10rem minmax(0, 1fr) 15rem; }
.tl figure { margin: 0; }
.tl figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface); }
@media (max-width: 900px) { .tl > li.has-img { grid-template-columns: 10rem minmax(0, 1fr); } .tl > li.has-img figure { grid-column: 2; max-width: 20rem; } }
.tl > li:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 640px) { .tl > li, .tl > li.has-img { grid-template-columns: 1fr; gap: 0.35rem; } .tl > li.has-img figure { grid-column: auto; margin-top: 0.75rem; } }
.when { font: 500 0.8125rem/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.org { font-weight: 700; font-size: 1.0625rem; margin: 0; }
.role-line { margin: 0 0 0.6rem; color: var(--muted); }
.tl ul { margin: 0; padding-left: 1.1rem; max-width: 66ch; }
.tl ul li { margin-bottom: 0.25rem; }
.tl ul li::marker { color: var(--muted); }
.note { margin: 0.6rem 0 0; font-size: 0.875rem; display: flex; gap: 0.5rem; align-items: baseline; }
.note::before { content: ""; width: 0.55rem; height: 0.55rem; background: var(--yellow); flex: none; transform: translateY(-0.05rem); }

/* Publications */
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.pubs li { display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: 1rem; padding-block: 1.1rem; border-top: 1px solid var(--line); }
.pubs li:first-child { border-top: 0; padding-top: 0; }
.pubs .yr { font: 500 0.875rem/1.6 var(--mono); }
.pubs .t { font-weight: 600; margin: 0; }
.pubs .v { color: var(--muted); font-size: 0.875rem; margin: 0.15rem 0 0; }
.pubs a { text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* Two-col areas */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5rem 3rem; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 1rem; padding-block: 0.8rem; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .when { font-size: 0.75rem; }
.list .what { margin: 0; font-weight: 600; }
.list .sub { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.875rem; }
h3 { font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }

/* About me */
.about-me { display: grid; gap: 1rem; max-width: 66ch; margin-bottom: 2.5rem; }
.about-me p { margin: 0; }
.about-me p:first-child { font-size: clamp(1.125rem, 2vw, 1.3125rem); font-weight: 500; line-height: 1.5; }

.about-photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; margin-bottom: 2.5rem; }
@media (max-width: 760px) { .about-photos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.about-photos figure { margin: 0; }
.about-photos img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); }
.about-photos figcaption { font: 400 0.75rem/1.4 var(--mono); color: var(--muted); margin-top: 0.4rem; }

/* Beyond */
.beyond { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 860px) { .beyond { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .beyond { grid-template-columns: 1fr; } }
.beyond div { display: flex; flex-direction: column; }
.beyond img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); margin-bottom: 0.75rem; border-bottom: 2px solid var(--fg); }
.beyond strong { display: block; font-family: var(--display); font-stretch: 112%; font-weight: 750; font-size: 1.0625rem; }
.beyond span { color: var(--muted); font-size: 0.9375rem; }

/* Contact */
.contact { margin-top: clamp(3rem, 7vw, 5rem); background: var(--fg); color: var(--bg); padding-block: clamp(2.5rem, 6vw, 4rem); }
.contact .eyebrow { color: var(--bg); opacity: 0.7; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
.mail span {
  font-family: var(--display); font-stretch: 125%; font-weight: 800;
  font-size: clamp(1.5rem, 5vw, 3rem); letter-spacing: -0.01em; overflow-wrap: anywhere; user-select: all;
}
.copy {
  font: 500 0.75rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--yellow); color: var(--on-yellow); border: 0; padding: 0.7rem 0.9rem; cursor: pointer;
}
.social { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1.75rem; font-family: var(--mono); font-size: 0.875rem; }
.social a { text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 4px; }
footer { padding-block: 1.25rem; font: 400 0.75rem/1.5 var(--mono); color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }

/* ---------- Portfolio ---------- */
.pf-head { padding-block: clamp(2.5rem, 6vw, 4.5rem) 1rem; }
.pf-head h1 { font-size: clamp(2.25rem, 6vw, 4rem); margin-bottom: 1rem; }
.pf-head p.lead { font-size: clamp(1.0625rem, 1.8vw, 1.25rem); max-width: 56ch; margin: 0; font-weight: 500; }
.jump { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
.jump a {
  font: 500 0.8125rem/1 var(--mono); text-decoration: none; letter-spacing: 0.04em;
  border: 1.5px solid var(--fg); padding: 0.6rem 0.8rem; display: inline-flex; gap: 0.5rem; align-items: center;
}
.jump a:hover { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow); }
.jump a span { color: var(--muted); }
.jump a:hover span { color: var(--on-yellow); }

.pf-sec { padding-block: clamp(2.5rem, 6vw, 4rem) 0; scroll-margin-top: 4rem; }
.pf-sec .intro { color: var(--muted); max-width: 62ch; margin: -1rem 0 2rem; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem 1.5rem; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

.card { display: flex; flex-direction: column; text-decoration: none; color: inherit; }
@media (min-width: 901px) { .card.wide { grid-column: span 2; } .card.wide .thumb { aspect-ratio: auto; height: 100%; min-height: 0; } .card.wide { display: grid; grid-template-rows: 1fr auto auto auto; } }
.card .thumb { position: relative; aspect-ratio: 4 / 3; background: var(--surface); overflow: hidden; border-bottom: 3px solid var(--fg); }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
.card:hover .thumb img { transform: scale(1.03); }
.card:hover .thumb, .card:focus-visible .thumb { border-bottom-color: var(--yellow); }
.card .tile {
  width: 100%; height: 100%; display: grid; place-items: center; background: var(--fg); color: var(--yellow);
  font-family: var(--display); font-stretch: 125%; font-weight: 850; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.01em;
}
.card .flag { position: absolute; left: 0; top: 0; background: var(--yellow); color: var(--on-yellow); font: 500 0.6875rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.45rem 0.55rem; }
.card .meta { font: 500 0.75rem/1.4 var(--mono); color: var(--muted); letter-spacing: 0.04em; margin: 0.85rem 0 0.35rem; font-variant-numeric: tabular-nums; }
.card h3.ct { font: 750 1.1875rem/1.25 var(--display); font-stretch: 105%; letter-spacing: -0.005em; text-transform: none; color: var(--fg); margin: 0 0 0.4rem; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
@media (prefers-reduced-motion: reduce) { .card .thumb img { transition: none; } }

/* Detail */
.detail { padding-block: 1.5rem 0; }
.back { font: 500 0.8125rem/1 var(--mono); text-decoration: none; display: inline-flex; gap: 0.4rem; padding-block: 0.5rem; color: var(--muted); }
.back:hover { color: var(--fg); }
.d-head { display: grid; gap: 1rem; padding-block: 1.25rem 1.75rem; }
.d-head h1 { font-size: clamp(2rem, 5.2vw, 3.5rem); margin: 0; }
.d-head .sub { font-size: clamp(1.0625rem, 1.8vw, 1.25rem); max-width: 60ch; margin: 0; font-weight: 500; }
.facts-d { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--fg); margin-bottom: 2rem; }
@media (max-width: 760px) { .facts-d { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts-d div { padding: 0.8rem 1rem 0.8rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
.facts-d dt { font: 500 0.6875rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }
.facts-d dd { margin: 0; font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
.d-hero { margin: 0 0 2.5rem; }
.d-hero img { display: block; width: 100%; max-height: 34rem; object-fit: cover; background: var(--surface); }
.d-hero figcaption, .gallery figcaption { font: 400 0.75rem/1.5 var(--mono); color: var(--muted); margin-top: 0.45rem; }
.d-body { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 2.5rem 3.5rem; align-items: start; }
@media (max-width: 860px) { .d-body { grid-template-columns: 1fr; } }
.d-body h2 { font-size: 1.25rem; margin: 0 0 0.75rem; }
.d-body .txt { display: grid; gap: 1.75rem; }
.d-body .txt p { margin: 0 0 0.8rem; max-width: 66ch; }
.d-body .txt p:last-child { margin-bottom: 0; }
.d-body ul { margin: 0; padding-left: 1.1rem; max-width: 66ch; }
.d-body ul li { margin-bottom: 0.35rem; }
.d-body ul li::marker { color: var(--muted); }
.result { background: var(--yellow); color: var(--on-yellow); padding: 1.25rem 1.25rem 1.35rem; }
.result h2 { color: var(--on-yellow); font-size: 0.75rem; font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.5rem; }
.result p { margin: 0; font-weight: 600; font-size: 1.0625rem; line-height: 1.45; }
.side { display: grid; gap: 1.5rem; }
.tools { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; padding: 0 !important; margin: 0; }
.tools li { font: 500 0.75rem/1 var(--mono); border: 1.5px solid var(--fg); padding: 0.4rem 0.55rem; margin: 0 !important; }
.links a { display: block; font-family: var(--mono); font-size: 0.875rem; padding-block: 0.25rem; text-decoration-color: var(--yellow); text-decoration-thickness: 2px; text-underline-offset: 3px; overflow-wrap: anywhere; }
.gallery-wrap { margin-top: 3rem; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem 1rem; }
@media (max-width: 760px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .gallery { grid-template-columns: 1fr; } }
.gallery figure { margin: 0; }
.gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface); }
.gallery img.contain { object-fit: contain; background: #ffffff; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; border-top: 2px solid var(--fg); }
.pn a { text-decoration: none; padding-block: 1rem; display: grid; gap: 0.25rem; min-width: 0; }
.pn a:last-child { text-align: right; }
.pn small { font: 500 0.6875rem/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pn strong { font-family: var(--display); font-weight: 750; overflow-wrap: anywhere; }
.pn a:hover strong { text-decoration: underline; text-decoration-color: var(--yellow); text-decoration-thickness: 3px; text-underline-offset: 4px; }
</style>

<body>

<header class="nav">
  <div class="wrap">
    <a class="mark" href="#top"><img src="img/logo.png" width="30" height="30" alt="">GVR</a>
    <nav class="links" aria-label="Sections">
      <a id="nav-home" href="index.html" data-k="navHome"></a>
      <a href="#projects" data-k="hProjects"></a>
      <a href="#activities" data-k="hActivities"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btn-ca" data-lang="ca">CA</button>
      <button type="button" id="btn-en" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <div id="index-view">
    <section class="pf-head">
      <div class="wrap">
        <p class="eyebrow">Portfolio</p>
        <h1 data-k="pfTitle"></h1>
        <p class="lead" data-k="pfLead"></p>
        <div class="jump" id="jump"></div>
      </div>
    </section>
    <section class="pf-sec" id="projects">
      <div class="wrap">
        <div class="sec-head"><h2 data-k="hProjects"></h2><span class="rule"></span></div>
        <p class="intro" data-k="projectsIntro"></p>
        <div class="grid" id="grid-projects"></div>
      </div>
    </section>
    <section class="pf-sec" id="activities">
      <div class="wrap">
        <div class="sec-head"><h2 data-k="hActivities"></h2><span class="rule"></span></div>
        <p class="intro" data-k="activitiesIntro"></p>
        <div class="grid" id="grid-activities"></div>
      </div>
    </section>
  </div>

  <article class="detail" id="detail-view" hidden>
    <div class="wrap" id="detail"></div>
  </article>

  <section class="contact" id="contact">

/* ---------- rendering ---------- */
let lang = "en";
try {
  const saved = localStorage.getItem("giol-lang");
  if (saved === "ca" || saved === "en") lang = saved;
  else if ((navigator.language || "").toLowerCase().startsWith("ca")) lang = "ca";
} catch (e) {}

const t = (x) => (x == null ? "" : typeof x === "string" ? x : x[lang]);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const projects = ITEMS.filter((i) => i.kind === "project");
const activities = ITEMS.filter((i) => i.kind === "activity");

function card(i) {
  const thumb = i.thumb
    ? `<img src="${i.thumb}" alt="" loading="lazy">`
    : `<div class="tile" aria-hidden="true">${esc(i.tile || "")}</div>`;
  return `<a class="card${i.wide ? " wide" : ""}" href="#${i.id}">
    <div class="thumb">${thumb}${i.current ? `<span class="flag">${t(UI.current)}</span>` : ""}</div>
    <p class="meta">${esc(t(i.year))} · ${esc(t(i.cat))}</p>
    <h3 class="ct">${esc(t(i.title))}</h3>
    <p>${esc(t(i.card))}</p>
  </a>`;
}

function renderIndex() {
  $("grid-projects").innerHTML = projects.map(card).join("");
  $("grid-activities").innerHTML = activities.map(card).join("");
  $("jump").innerHTML =
    `<a href="#projects">${t(UI.hProjects)} <span>${projects.length}</span></a>` +
    `<a href="#activities">${t(UI.hActivities)} <span>${activities.length}</span></a>`;
}

function renderDetail(i) {
  const f = i.facts || {};
  const fact = (k) => (f[k] ? `<div><dt>${t(UI[k])}</dt><dd>${esc(t(f[k]))}</dd></div>` : "");
  const pos = ITEMS.indexOf(i);
  const prev = ITEMS[(pos - 1 + ITEMS.length) % ITEMS.length];
  const next = ITEMS[(pos + 1) % ITEMS.length];
  const hero = i.gallery && i.gallery.length && !i.gallery[0].contain ? i.gallery[0] : null;
  const rest = i.gallery ? (hero ? i.gallery.slice(1) : i.gallery) : [];
  const facts = ["when", "where", "role", "team"].map(fact).join("");

  $("detail").innerHTML = `
    <a class="back" href="#${i.kind === "project" ? "projects" : "activities"}">${t(UI.back)}</a>
    <header class="d-head">
      <p class="eyebrow" style="margin:0">${esc(t(i.year))} · ${esc(t(i.cat))}</p>
      <h1>${esc(t(i.title))}</h1>
      <p class="sub">${esc(t(i.sub))}</p>
    </header>
    ${facts ? `<dl class="facts-d">${facts}</dl>` : ""}
    ${hero ? `<figure class="d-hero"><img src="${hero.src}" alt="${esc(t(hero.cap))}"><figcaption>${esc(t(hero.cap))}</figcaption></figure>` : ""}
    <div class="d-body">
      <div class="txt">
        ${i.about ? `<section><h2>${t(UI.about)}</h2>${i.about.map((p) => `<p>${esc(t(p))}</p>`).join("")}</section>` : ""}
        ${i.did ? `<section><h2>${t(UI.whatIDid)}</h2><ul>${i.did.map((d) => `<li>${esc(t(d))}</li>`).join("")}</ul></section>` : ""}
      </div>
      <aside class="side">
        ${i.result ? `<div class="result"><h2>${t(UI.result)}</h2><p>${esc(t(i.result))}</p></div>` : ""}
        ${i.tools ? `<div><h3>${t(UI.tools)}</h3><ul class="tools">${i.tools.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${i.links ? `<div class="links"><h3>${t(UI.links)}</h3>${i.links.map((l) => `<a href="${l.href}" target="_blank" rel="noopener">${esc(t(l.label))}</a>`).join("")}</div>` : ""}
      </aside>
    </div>
    ${rest.length ? `<section class="gallery-wrap"><div class="sec-head"><h2>${t(UI.gallery)}</h2><span class="rule"></span></div>
      <div class="gallery">${rest.map((g) => `<figure><img src="${g.src}" alt="${esc(t(g.cap))}" loading="lazy"${g.contain ? ' class="contain"' : ""}><figcaption>${esc(t(g.cap))}</figcaption></figure>`).join("")}</div></section>` : ""}
    <nav class="pn" aria-label="More">
      <a href="#${prev.id}"><small>${t(UI.prev)}</small><strong>${esc(t(prev.title))}</strong></a>
      <a href="#${next.id}"><small>${t(UI.next)}</small><strong>${esc(t(next.title))}</strong></a>
    </nav>`;
}

function route() {
  const id = (location.hash || "").slice(1);
  const item = ITEMS.find((i) => i.id === id);
  $("index-view").hidden = !!item;
  $("detail-view").hidden = !item;
  if (item) { renderDetail(item); window.scrollTo(0, 0); document.title = t(item.title) + " · Giol Vinyals-i-Roca"; }
  else {
    document.title = "Portfolio · Giol Vinyals-i-Roca";
    if (id) { const el = document.getElementById(id); if (el) el.scrollIntoView(); }
  }
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-k]").forEach((el) => (el.textContent = t(UI[el.dataset.k])));
  $("btn-ca").setAttribute("aria-pressed", String(lang === "ca"));
  $("btn-en").setAttribute("aria-pressed", String(lang === "en"));
  renderIndex();
  route();
}

document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("giol-lang", lang); } catch (e) {}
    render();
  })
);
window.addEventListener("hashchange", route);

$("copy").addEventListener("click", () => {
  const btn = $("copy");
  const done = () => { btn.textContent = t(UI.copied); setTimeout(() => (btn.textContent = t(UI.copy)), 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("email")); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText($("email").textContent).then(done, fallback); } catch (e) { fallback(); }
});

render();
</script>
